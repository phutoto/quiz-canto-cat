    <style>
        * {
            margin: 0;

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;

        }

        h1 {

        }

        .menu {

        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn:hover {
            transform: translateX(5px);
            background: rgba(255,255,255,0.2);
        }

        .btn-icon {
            font-size: 1.5rem;
        }

        .btn-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            flex: 1;
            margin-left: 15px;
        }

        .btn-arrow {
            color: #f0a500;
            font-size: 1.2rem;
        }

        footer {
            text-align: center;
            color: #666;
            margin-top: 40px;
            font-size: 0.7rem;
        }
    </style>
</head>
